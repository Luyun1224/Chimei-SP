<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SP Performance Hub：大行事曆本 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33605A"/>
      <stop offset="1" stop-color="#1E3834"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EFE6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 後面的頁（厚度） -->
  <rect x="104" y="128" width="304" height="300" rx="34" fill="#C9BFA9"/>
  <rect x="96" y="118" width="320" height="300" rx="36" fill="#E7E0D1"/>
  <!-- 主頁面 -->
  <rect x="86" y="104" width="340" height="304" rx="38" fill="url(#page)"/>
  <!-- 香檳金頁首 -->
  <path d="M86 142a38 38 0 0 1 38-38h264a38 38 0 0 1 38 38v40H86z" fill="#C6A77A"/>
  <!-- 線圈 -->
  <g fill="#1E3834">
    <rect x="150" y="70" width="26" height="70" rx="13"/>
    <rect x="243" y="70" width="26" height="70" rx="13"/>
    <rect x="336" y="70" width="26" height="70" rx="13"/>
  </g>
  <g fill="#F7F4ED" opacity=".55">
    <rect x="155" y="78" width="7" height="38" rx="3.5"/>
    <rect x="248" y="78" width="7" height="38" rx="3.5"/>
    <rect x="341" y="78" width="7" height="38" rx="3.5"/>
  </g>
  <!-- 日期格 -->
  <g fill="#D3DED6">
    <rect x="122" y="212" width="50" height="42" rx="10"/><rect x="186" y="212" width="50" height="42" rx="10"/>
    <rect x="250" y="212" width="50" height="42" rx="10"/><rect x="314" y="212" width="50" height="42" rx="10"/>
    <rect x="122" y="268" width="50" height="42" rx="10"/><rect x="250" y="268" width="50" height="42" rx="10"/>
    <rect x="314" y="268" width="50" height="42" rx="10"/>
    <rect x="122" y="324" width="50" height="42" rx="10"/><rect x="186" y="324" width="50" height="42" rx="10"/>
    <rect x="250" y="324" width="50" height="42" rx="10"/>
  </g>
  <!-- 標記演出的日子 -->
  <rect x="186" y="268" width="50" height="42" rx="10" fill="#284A45"/>
  <rect x="314" y="324" width="50" height="42" rx="10" fill="#C6A77A"/>
  <path d="M198 289l9 9 18-19" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

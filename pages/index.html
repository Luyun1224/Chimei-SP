<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SP Performance Hub｜奇美醫院臨床技能中心</title>
  <meta name="robots" content="noindex" />
  <style>
    html, body { margin:0; height:100%; background:#F7F4ED; }
    iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
    #loading { position:fixed; inset:0; display:grid; place-items:center; color:#284A45;
      font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:15px; }
    #direct { position:fixed; right:14px; bottom:14px; z-index:2; padding:6px 12px; border-radius:999px; background:rgba(40,74,69,.85);
      color:#fff; font:12px system-ui,"Noto Sans TC",sans-serif; text-decoration:none; opacity:.35; transition:opacity .2s; }
    #direct:hover, #direct:focus-visible { opacity:1; }
  </style>
</head>
<body>
  <div id="loading">SP Performance Hub 載入中…</div>
  <!-- 正式系統（Google Apps Script）。讀寫 Google Sheets 與權限檢查仍由 Apps Script 以管理員本人的 Google 身分處理 -->
  <iframe id="app" title="SP Performance Hub" allow="clipboard-write"
          src="https://script.google.com/macros/s/AKfycbwVaaFH9s-UcBP6_WWGASIwsAWWa76lkgqUbkUVItl5dgFTIYZMf9B0oBzPmtkrdR8I/exec"
          onload="var l=document.getElementById('loading'); if (l) l.remove();"></iframe>
  <a id="direct" target="_blank" rel="noopener" title="第一次授權或畫面空白時，請改在新分頁開啟"
     href="https://script.google.com/macros/s/AKfycbwVaaFH9s-UcBP6_WWGASIwsAWWa76lkgqUbkUVItl5dgFTIYZMf9B0oBzPmtkrdR8I/exec">↗ 新分頁開啟</a>
</body>
</html>

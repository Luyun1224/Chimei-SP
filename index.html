<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SP 演出紀錄儀表板</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="viz-root">
    <header class="topbar">
      <div>
        <h1>SP 演出紀錄儀表板</h1>
        <p class="sub">標準化病人（SP）演出登錄、年度時數統計與明日提醒</p>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="btn-new">＋ 新增演出紀錄</button>
        <details class="menu">
          <summary class="btn">資料 ▾</summary>
          <div class="menu-list">
            <button id="btn-export-csv">匯出 CSV（Excel 可開）</button>
            <button id="btn-export-json">備份 JSON</button>
            <label class="file-btn">匯入 JSON / CSV<input type="file" id="file-import" accept=".json,.csv" hidden /></label>
            <button id="btn-sample">載入範例資料</button>
            <button id="btn-clear" class="danger">清除全部資料</button>
          </div>
        </details>
      </div>
    </header>

    <!-- Filters: one row, scope everything below -->
    <section class="filters" aria-label="篩選">
      <label>年度
        <select id="f-year"></select>
      </label>
      <label>單位
        <select id="f-unit"><option value="">全部單位</option></select>
      </label>
      <label>SP
        <select id="f-sp"><option value="">全部 SP</option></select>
      </label>
      <label class="grow">搜尋
        <input type="search" id="f-q" placeholder="教案主題、單位、SP 姓名…" />
      </label>
    </section>

    <!-- Tomorrow reminder -->
    <section class="card reminder" id="reminder-card" aria-live="polite">
      <div class="card-head">
        <h2>📣 明日演出提醒 <span class="muted" id="tomorrow-label"></span></h2>
        <button class="btn small" id="btn-copy-reminder">複製提醒訊息</button>
      </div>
      <div id="reminder-body"></div>
    </section>

    <!-- KPI tiles -->
    <section class="tiles" id="tiles"></section>

    <!-- Charts -->
    <section class="grid-2">
      <div class="card">
        <div class="card-head">
          <h2>各 SP 年度演出時數</h2>
          <span class="muted small" id="sp-chart-note"></span>
        </div>
        <div id="chart-sp" class="chart"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>每月演出時數</h2>
          <span class="muted small">所有 SP 時數加總</span>
        </div>
        <div id="chart-month" class="chart"></div>
      </div>
    </section>

    <!-- SP summary table -->
    <section class="card">
      <div class="card-head">
        <h2>SP 年度統計</h2>
        <span class="muted small">演出時數＝演出開始至結束；在院時數＝報到至演出結束</span>
      </div>
      <div class="table-wrap">
        <table id="tbl-sp">
          <thead>
            <tr>
              <th>SP 姓名</th>
              <th class="num">演出場次</th>
              <th class="num">演出時數</th>
              <th class="num">在院時數</th>
              <th>服務單位</th>
              <th>最近一次演出</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Records table -->
    <section class="card">
      <div class="card-head">
        <h2>演出紀錄 <span class="muted" id="rec-count"></span></h2>
      </div>
      <div class="table-wrap">
        <table id="tbl-rec">
          <thead>
            <tr>
              <th>日期</th>
              <th>單位</th>
              <th>報到</th>
              <th>演出時間</th>
              <th>教案主題</th>
              <th>SP 姓名</th>
              <th class="num">時數</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="empty" id="rec-empty" hidden>這個篩選條件下還沒有紀錄，按「＋ 新增演出紀錄」開始登錄。</p>
    </section>

    <footer class="foot muted small">
      資料目前儲存在此瀏覽器（localStorage）。請定期用「資料 ▾ → 備份 JSON」備份。
    </footer>
  </div>

  <!-- Record dialog -->
  <dialog id="dlg">
    <form id="rec-form" method="dialog">
      <h2 id="dlg-title">新增演出紀錄</h2>
      <div class="form-grid">
        <label>演出日期 <input type="date" name="date" required /></label>
        <label>單位 <input type="text" name="unit" list="dl-unit" required placeholder="例：醫學系 UGY" /></label>
        <label>報到時間 <input type="time" name="checkin" required /></label>
        <label>演出開始 <input type="time" name="start" required /></label>
        <label>演出結束 <input type="time" name="end" required /></label>
        <label class="span-2">教案主題 <input type="text" name="topic" list="dl-topic" required placeholder="例：胸痛病史詢問" /></label>
        <label class="span-3">SP 姓名（可多位，以逗號或頓號分隔）
          <input type="text" name="sps" list="dl-sp" required placeholder="例：王小明、李美華" />
        </label>
        <label class="span-3">備註 <textarea name="note" rows="2" placeholder="選填：考場、聯絡事項…"></textarea></label>
      </div>
      <p class="form-hint" id="form-hint"></p>
      <div class="dlg-actions">
        <button type="button" class="btn" id="btn-cancel">取消</button>
        <button type="submit" class="btn primary" value="save">儲存</button>
      </div>
    </form>
  </dialog>
  <datalist id="dl-unit"></datalist>
  <datalist id="dl-topic"></datalist>
  <datalist id="dl-sp"></datalist>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches: [main, claude/stoic-galileo-wibuz5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build demo (no Google connection)
        run: npx vite build
      - name: Build app for Apps Script (loaded by doGet)
        run: npx vite build -c vite.remote.config.ts
      - name: Assemble site
        run: |
          mkdir -p site/demo
          cp pages/index.html site/index.html
          cp dist/index.html site/demo/index.html
          mkdir -p site/app
          cp dist-app/app.js dist-app/app.css site/app/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
